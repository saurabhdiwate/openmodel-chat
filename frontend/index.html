<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenModel Chat</title>
  </head>
  <body>
    <script>
      (() => {
        const root = document.documentElement;
        const defaultDark = {
          background: "#0A1210",
          foreground: "#ECFDF6",
          primary: "#10B981",
          secondary: "#13201A",
          accent: "#2DD4BF",
          muted: "#5E7A6F",
          border: "#1E2D27",
          surface: "#13201A",
          "surface-strong": "#182720",
          "surface-stronger": "#20332B",
          overlay: "#2B4038",
          "overlay-strong": "#3A5349",
          text: "#ECFDF6",
          "text-muted": "#9CB5AB",
          "text-subtle": "#D1E4DB",
          red: "#F87171",
          green: "#4ADE80",
          yellow: "#FACC15",
          blue: "#60A5FA",
          pink: "#F472B6",
          teal: "#2DD4BF",
          mauve: "#A78BFA",
          peach: "#FB923C",
          sky: "#38BDF8",
          lavender: "#A5B4FC",
          canvas: "#101A16",
          "canvas-alt": "#152320",
          "canvas-strong": "#0A1210",
        };

        let mode = "dark";
        try {
          const raw = localStorage.getItem("theme-store-v2");
          if (raw) {
            const parsed = JSON.parse(raw);
            mode = parsed?.state?.mode || mode;
          }
        } catch {
          /* ignore */
        }

        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
        Object.entries(defaultDark).forEach(([key, value]) => {
          root.style.setProperty(`--theme-${key}`, value);
        });
        root.style.setProperty("--shadow-color", "10 18 16");
        root.style.setProperty("--inverted-text", defaultDark.text);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
